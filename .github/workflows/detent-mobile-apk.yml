name: Detent Mobile APK

on:
  push:
    branches: [detent-legacy-android-build-temp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Patch checked JSON exception
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('detent-mobile/app/src/main/java/dev/detent/mobile/MainActivity.java')
          s = p.read_text()
          old = '        history.put(new JSONObject().put("role", role).put("content", content));\n        saveHistory();'
          new = '''        try {
              JSONObject item = new JSONObject();
              item.put("role", role);
              item.put("content", content);
              history.put(item);
              saveHistory();
          } catch (Exception ignored) { }'''
          if old not in s:
              raise SystemExit('appendHistory statements not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build release APK
        working-directory: detent-mobile
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and normalize
        run: |
          set -euo pipefail
          APK=$(find detent-mobile/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/detent-mobile-personal.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose dist/detent-mobile-personal.apk
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging dist/detent-mobile-personal.apk | tee dist/apk-info.txt
          sha256sum dist/detent-mobile-personal.apk | tee dist/SHA256SUMS.txt
          ls -lh dist/detent-mobile-personal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: detent-mobile-personal
          path: dist/
          if-no-files-found: error
          retention-days: 7
