name: Detent Mobile APK

on:
  push:
    branches: [detent-legacy-android-build-temp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detent-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 35 toolchain
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run JVM behavior tests
        working-directory: detent-mobile
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build release APK
        working-directory: detent-mobile
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and normalize
        run: |
          set -euo pipefail
          APK=$(find detent-mobile/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/detent-mobile-personal.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose dist/detent-mobile-personal.apk
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging dist/detent-mobile-personal.apk | tee dist/apk-info.txt
          sha256sum dist/detent-mobile-personal.apk | tee dist/SHA256SUMS.txt
          ls -lh dist/detent-mobile-personal.apk

      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb install -r dist/detent-mobile-personal.apk
            adb shell am force-stop dev.detent.mobile
            adb shell am start -W -n dev.detent.mobile/.MainActivity | tee /tmp/activity-start.txt
            grep -q 'Status: ok' /tmp/activity-start.txt
            sleep 3
            adb shell pidof dev.detent.mobile
            adb shell dumpsys activity activities | grep -q 'dev.detent.mobile/.MainActivity'
            adb exec-out screencap -p > dist/emulator-home.png
            adb logcat -d -t 500 | tee /tmp/detent-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: dev\.detent\.mobile.*has died|ANR in dev\.detent\.mobile' /tmp/detent-logcat.txt; then
              echo 'Detent mobile failed runtime smoke test' >&2
              exit 1
            fi

      - uses: actions/upload-artifact@v4
        with:
          name: detent-mobile-personal
          path: dist/
          if-no-files-found: error
          retention-days: 7
